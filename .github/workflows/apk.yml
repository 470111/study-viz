name: Build Android APK (TWA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Generate app icon (512)
        run: node scripts/make-icon.mjs

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Configure Bubblewrap (no prompts)
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          JDK_PATH="${JAVA_HOME:-}"
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -z "$JDK_PATH" ]; then
            echo "JAVA_HOME is empty" >&2
            exit 1
          fi
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"$JDK_PATH","androidSdkPath":"$ANDROID_SDK_PATH"}
          EOF
          echo "bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate TWA Android project (no Bubblewrap prompts)
        run: node scripts/gen-twa-project.mjs

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore twa/android.keystore \
            -storepass password \
            -alias android \
            -keypass password \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StudyViz, OU=StudyViz, O=StudyViz, L=CN, S=CN, C=CN"

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password
          BUBBLEWRAP_KEY_PASSWORD: password
        run: |
          cd twa
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-viz-apk
          path: |
            twa/*.apk
            twa/app/build/outputs/**/*.apk
