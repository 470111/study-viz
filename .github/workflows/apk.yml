name: Build Android APK (TWA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Bubblewrap requires $SDK/tools or $SDK/bin — setup-android installs the legacy `tools` pkg by default.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install deps
        run: npm ci

      # Needed by scripts/gen-twa-project.mjs; keep even if package-lock on GitHub omits it.
      - name: Install @bubblewrap/core (TWA generator)
        run: npm install @bubblewrap/core@1.24.1 --no-save --no-audit --no-fund

      - name: Generate app icon (512)
        run: node scripts/make-icon.mjs

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Configure Bubblewrap (no prompts)
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "JAVA_HOME is empty" >&2
            exit 1
          fi
          if [ -z "${ANDROID_SDK_PATH:-}" ] || [ ! -d "$ANDROID_SDK_PATH" ]; then
            echo "Android SDK missing; ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >&2
            exit 1
          fi
          python3 -c '
          import json, os, pathlib
          sdk = os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME") or ""
          cfg = {"jdkPath": os.environ["JAVA_HOME"], "androidSdkPath": sdk}
          pathlib.Path.home().joinpath(".bubblewrap/config.json").write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          print(cfg)
          '
          echo "--- bubblewrap config.json ---"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate TWA Android project (no Bubblewrap prompts)
        run: node scripts/gen-twa-project.mjs

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore twa/android.keystore \
            -storepass password \
            -alias android \
            -keypass password \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StudyViz, OU=StudyViz, O=StudyViz, L=CN, S=CN, C=CN"

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password
          BUBBLEWRAP_KEY_PASSWORD: password
        run: |
          cd twa
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-viz-apk
          path: |
            twa/*.apk
            twa/app/build/outputs/**/*.apk

